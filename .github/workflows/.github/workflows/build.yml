
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Criar estrutura Android
        run: flutter create --platforms=android .
     
      - name: Limpar arquivos antigos
        run: flutter clean
      
      - name: Verificar estrutura Android
        run: |
          ls -la android/app
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

      - name: Instalar dependencias
        run: flutter pub get

      - name: Gerar APK
        run: flutter build apk --release

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: marido-de-aluguel-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
